spring:
  application:
    name: budgettracker
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate  
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health