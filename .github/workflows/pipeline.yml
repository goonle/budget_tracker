name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 머지가 연달아 들어와도 배포가 겹치지 않게 함
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ex: ghcr.io/goonle/budget_tracker (GitHub Container Registry)

jobs:
  # ───────────────────────── CI ─────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4   # for caching gradle wrapper and dependencies

      - name: Build and test
        run: ./gradlew build                     # compile + test(including Testcontainers) + bootJar

  # ───────────────────────── CD: docker image ─────────────────────────
  image:
    needs: test                                  
    if: github.event_name == 'push'              
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                            # for pushing docker image to GitHub Container Registry
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar (tests already passed)
        run: ./gradlew bootJar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automatically provided token. no need to create separately

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # ───────────────────────── CD: deploy ─────────────────────────
  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/budgettracker
            export IMAGE_TAG
            docker compose pull app
            docker compose up -d app

            # Health check: maximum 150 seconds to wait (Spring Boot startup can be slow on e2-micro)
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
                echo "Deployed $IMAGE_TAG"
                docker image prune -af      # clean up old images (protects 30GB disk space)
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed"
            docker compose logs --tail=100 app
            exit 1